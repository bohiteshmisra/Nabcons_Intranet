name: Tests

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and integration tests (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build NabconsIntranet.slnx -c Release
      - name: Test
        run: dotnet test tests/NabconsIntranet.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=normal" --results-directory test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/

  e2e:
    name: Browser acceptance tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install test tools (Playwright, Pillow, poppler)
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y poppler-utils python3-pil >/dev/null
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/pw/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Run browser tests
        run: bash tests/e2e/run-all.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: |
            tests/e2e/out/
            !tests/e2e/out/publish/
            !tests/e2e/out/app/
